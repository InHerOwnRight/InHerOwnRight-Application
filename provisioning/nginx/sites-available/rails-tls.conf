server {

  if ($ua_redirect) {
    return 444;
  }

  deny 23.22.35.162;
  deny 3.224.220.101;
  deny 52.70.240.171;

  listen 443 ssl http2;
  server_name SITE_DOMAINS;
  root /var/www/rails/public;

  # Path to certs
  ssl_certificate /etc/letsencrypt/live/staging.inherownright.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/staging.inherownright.org/privkey.pem;
  ssl_session_timeout 1d;
  ssl_session_cache shared:MySSL:10m;
  ssl_session_tickets off;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
 
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
  ssl_prefer_server_ciphers off;
 
  # HSTS 
  add_header Strict-Transport-Security "max-age=63072000" always;
 
  # OCSP stapling
  ssl_stapling on;
  ssl_stapling_verify on;
 
  # verify chain of trust of OCSP response using Root CA and Intermediate certs
  ssl_trusted_certificate /etc/letsencrypt/live/staging.inherownright.org/chain.pem;

  ##
  # Nginx Bad Bot Blocker Includes
  # REPO: https://github.com/mitchellkrogza/nginx-ultimate-bad-bot-blocker
  ##
  include /etc/nginx/bots.d/ddos.conf; 
  include /etc/nginx/bots.d/blockbots.conf;

  client_max_body_size 2m;

  passenger_enabled on;
  passenger_user app;

  passenger_ruby /usr/bin/ruby;
}
