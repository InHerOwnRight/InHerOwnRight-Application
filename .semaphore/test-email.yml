version: v1.0
name: Send Test Email
agent:
  machine:
    type: e1-standard-2
    os_image: ubuntu2004
blocks:
  - name: Send Test Email
    task:
      jobs:
        - name: Send Email
          commands:
            - |
              curl --silent --user "api:$MAILGUN_API_KEY" "https://api.mailgun.net/v3/mg.inherownright.org/messages" \
                -F from='admin@mg.inherownright.org' \
                -F to="$RECIPIENT_EMAILS" \
                -F subject="Test Email" \
                -F text="Testing"
